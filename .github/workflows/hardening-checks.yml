name: Focused hardening checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: Run the existing offline suite (known historical failures remain)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: node scripts/check-release.cjs
  existing-offline-suite:
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: node scripts/check-release.cjs --full
