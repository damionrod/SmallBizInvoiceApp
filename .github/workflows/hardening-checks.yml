name: Focused hardening checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: Run the existing offline suite (known historical failures remain)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: '24.19.0'
      - run: node scripts/check-release.cjs
  existing-offline-suite:
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: '24.19.0'
      - run: node scripts/check-release.cjs --full
