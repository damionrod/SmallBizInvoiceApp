name: Frindly Phase 63 disposable PostgreSQL settlement tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-settlement-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phase57
          POSTGRES_PASSWORD: phase57_disposable_only
          POSTGRES_DB: frindly_phase57_disposable
        ports:
          - 127.0.0.1:55457:5432
        options: >-
          --health-cmd "pg_isready -U phase57 -d frindly_phase57_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test driver
        run: python -m pip install 'psycopg2-binary==2.9.10'
      - name: Validate test files
        run: |
          python -m py_compile phase63/run_tests.py phase63/offline_preflight.py
          python phase63/offline_preflight.py
      - name: Execute settlement tests against disposable PostgreSQL
        env:
          PHASE57_DATABASE_URL: postgresql://phase57:phase57_disposable_only@127.0.0.1:55457/frindly_phase57_disposable
        run: python phase63/run_tests.py
