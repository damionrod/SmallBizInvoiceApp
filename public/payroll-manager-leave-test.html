<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frindly Leave Drafts — Isolated Test Only</title>
<style>
body{font:16px system-ui,sans-serif;background:#f5f5f8;color:#1b2330;margin:0;padding:16px}
main{max-width:820px;margin:auto}.panel{background:white;border:1px solid #d9dce4;border-radius:12px;padding:20px;margin-bottom:16px}
label{display:block;margin:10px 0;font-size:.9rem}input{display:block;width:100%;padding:10px;border:1px solid #b8bec9;border-radius:7px;box-sizing:border-box}
button{padding:10px 16px;background:#6035a5;color:white;border:0;border-radius:7px;cursor:pointer;min-height:42px}
button:disabled{opacity:.5}#status{white-space:pre-wrap}small{color:#555}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./payroll-manager-leave-isolated.js"></script>
</head><body><main>
<h1>Leave drafts — isolated testing</h1>
<p><strong>Not production.</strong> This page does not change the existing Payroll interface or approve leave.</p>
<section class="panel" id="loginPanel">
<form id="connect">
<label>Isolated Supabase publishable/anon key<input id="key" type="password" autocomplete="off" required></label>
<label>Email<input id="email" type="email" autocomplete="username" required></label>
<label>Password<input id="password" type="password" autocomplete="current-password" required></label>
<button id="connectBtn">Sign in to isolated testing</button>
</form>
<p><small>Uses only the isolated Supabase project. Credentials are not stored by this page. Sign-in may be rejected if the account is not present in the isolated environment.</small></p>
</section>
<p id="status" role="status" aria-live="polite"></p>
<section id="draftRoot" class="panel" hidden></section>
<button id="logout" hidden>Sign out</button>
</main><script>
(function(){
'use strict';
const PROJECT='smvvevrtjqkflyqkyape',URL='https://'+PROJECT+'.supabase.co';
let client=null,view=null;
const $=id=>document.getElementById(id), status=$('status');
$('connect').addEventListener('submit',async ev=>{
 ev.preventDefault();
 const btn=$('connectBtn');btn.disabled=true;status.textContent='Signing in…';
 try{
   if(!window.supabase?.createClient||!window.FrindlyManagerLeaveDrafts?.mount)throw Error('Required scripts unavailable');
   client=window.supabase.createClient(URL,$('key').value.trim(),{
     auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}
   });
   const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
   if(error)throw error;
   $('password').value='';$('key').value='';
   $('loginPanel').hidden=true;$('draftRoot').hidden=false;$('logout').hidden=false;
   view=window.FrindlyManagerLeaveDrafts.mount($('draftRoot'),{client});
   status.textContent='Signed in to isolated project. Draft creation only.';
 }catch(err){status.textContent='Unable to sign in: '+(err.message||'Unknown error');}
 finally{btn.disabled=false;}
});
$('logout').addEventListener('click',async()=>{
 if(view)view.destroy();
 if(client)await client.auth.signOut();
 client=null;view=null;
 $('draftRoot').hidden=true;$('logout').hidden=true;$('loginPanel').hidden=false;
 status.textContent='Signed out.';
});
})();
</script></body></html>
